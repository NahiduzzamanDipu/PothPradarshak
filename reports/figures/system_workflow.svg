<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1800" viewBox="0 0 1240 1800"
     font-family="'Source Sans 3','Noto Sans Bengali','Segoe UI',sans-serif">
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
          orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
  </marker>
</defs>
<rect width="1240" height="1800" fill="#ffffff"/>
<text x="620.0" y="44" text-anchor="middle" font-size="27" fill="#0f172a" font-weight="700">Workflow of the Proposed System</text>
<text x="620.0" y="70" text-anchor="middle" font-size="13.5" fill="#64748b" font-weight="400">VisionAssist AI  —  Object Detection and Navigation Assistance for Visually Impaired Individuals</text>
<rect x="40" y="92" width="1160" height="316" rx="12" fill="#f6f8fa" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="64" y="120" text-anchor="start" font-size="13" fill="#475569" font-weight="700">PHASE 1   ·   OFFLINE DATASET PREPARATION AND TRAINING   ·   performed once</text>
<rect x="60" y="138" width="252" height="88" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="186.0" y="171.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Raw image pool</text>
<text x="186.0" y="188.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">21,359 images</text>
<text x="186.0" y="203.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">mixed sources, no labels</text>
<rect x="356" y="138" width="252" height="88" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="482.0" y="171.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Domain selection</text>
<text x="482.0" y="188.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">3,000 Dhaka footpath</text>
<text x="482.0" y="203.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">numeric name, 256 × 256</text>
<rect x="652" y="138" width="252" height="88" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="778.0" y="171.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">De-duplication</text>
<text x="778.0" y="188.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">dHash, Hamming ≤ 5</text>
<text x="778.0" y="203.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">2,787  ( −213, 7.1% )</text>
<rect x="948" y="138" width="252" height="88" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1074.0" y="171.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Pre-annotation</text>
<text x="1074.0" y="188.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">YOLOv8x-WorldV2</text>
<text x="1074.0" y="203.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">35 text prompts</text>
<rect x="60" y="282" width="252" height="88" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="186.0" y="315.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Human verification</text>
<text x="186.0" y="332.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">2,782 images</text>
<text x="186.0" y="347.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">23,962 bounding boxes</text>
<rect x="356" y="282" width="252" height="88" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="482.0" y="315.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Split 70 / 20 / 10</text>
<text x="482.0" y="332.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">seed 42, cluster-level</text>
<text x="482.0" y="347.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">no near-copy leakage</text>
<rect x="652" y="282" width="252" height="88" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="778.0" y="315.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Training</text>
<text x="778.0" y="332.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">YOLO11n, 100 epochs</text>
<text x="778.0" y="347.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">RTX 3050 Ti, 3.72 hours</text>
<rect x="948" y="282" width="252" height="88" rx="7" fill="#e6f4ec" stroke="#1d6b4f" stroke-width="2"/>
<text x="1074.0" y="315.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Trained weights</text>
<text x="1074.0" y="332.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">best.pt  ·  5.5 MB</text>
<text x="1074.0" y="347.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">2,591,595 parameters</text>
<polyline points="312,182.0 356,182.0" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="312,326.0 356,326.0" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="608,182.0 652,182.0" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="608,326.0 652,326.0" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="904,182.0 948,182.0" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="904,326.0 948,326.0" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="1074.0,226 1074.0,248 186.0,248 186.0,282" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<polyline points="1074.0,370 1074.0,424 875,424 875,726" fill="none" stroke="#1d6b4f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#ah)"/>
<text x="1010" y="440" text-anchor="middle" font-size="11.5" fill="#1d6b4f" font-weight="400" font-style="italic">trained weights loaded at start-up</text>
<rect x="40" y="452" width="1160" height="1300" rx="12" fill="#ffffff" stroke="#1d6b4f" stroke-width="2"/>
<text x="64" y="480" text-anchor="start" font-size="13" fill="#1d6b4f" font-weight="700">PHASE 2   ·   RUNTIME WORKFLOW   ·   executed per frame</text>
<rect x="92" y="500" width="330" height="76" rx="7" fill="#eaf2fd" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="257.0" y="535.5" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Live camera</text>
<text x="257.0" y="551.8" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">laptop webcam or phone browser</text>
<rect x="455" y="500" width="330" height="76" rx="7" fill="#eaf2fd" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="620.0" y="535.5" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Uploaded image</text>
<text x="620.0" y="551.8" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">single frame analysis</text>
<rect x="818" y="500" width="330" height="76" rx="7" fill="#eaf2fd" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="983.0" y="535.5" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Recorded video</text>
<text x="983.0" y="551.8" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">streamed frame by frame</text>
<text x="620.0" y="494" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="700">INPUT MODE</text>
<polyline points="257.0,576 257.0,606 620,606 620,620" fill="none" stroke="#1d4ed8" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="620.0,576 620.0,606 620,606 620,620" fill="none" stroke="#1d4ed8" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="983.0,576 983.0,606 620,606 620,620" fill="none" stroke="#1d4ed8" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="620,606 620,624" fill="none" stroke="#1d4ed8" stroke-width="1.9" marker-end="url(#ah)"/>
<rect x="380" y="626" width="480" height="62" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="620.0" y="662.1" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Frame acquisition and normalisation</text>
<polyline points="620,688 620,716" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="108" y="716" width="1024" height="152" rx="10" fill="#e6f4ec" stroke="#1d6b4f" stroke-width="1.8"/>
<text x="126" y="740" text-anchor="start" font-size="12" fill="#1d6b4f" font-weight="700">DETECTION  ·  two models run on the same frame</text>
<rect x="130" y="752" width="470" height="96" rx="7" fill="#ffffff" stroke="#1d6b4f" stroke-width="1.6"/>
<text x="365.0" y="782.3" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Thesis model — best.pt</text>
<text x="365.0" y="798.6" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">9 footpath classes: person, pole, tree, stairs,</text>
<text x="365.0" y="813.8" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">pothole, open_drain, parked_vehicle,</text>
<text x="365.0" y="829.0" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">street_obstacle, curb</text>
<rect x="640" y="752" width="470" height="96" rx="7" fill="#ffffff" stroke="#94a3b8" stroke-width="1.6"/>
<text x="875.0" y="782.3" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">COCO model — yolo11n.pt</text>
<text x="875.0" y="798.6" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">12 indoor classes: chair, table, bed, couch,</text>
<text x="875.0" y="813.8" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">bench, plant, tv, fridge, oven, microwave,</text>
<text x="875.0" y="829.0" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">sink, toilet   (no thesis-measured mAP)</text>
<text x="1116" y="740" text-anchor="end" font-size="12" fill="#1d6b4f" font-weight="700">19.0 ms forward pass</text>
<polyline points="365,868 365,890 620,890 620,906" fill="none" stroke="#1d6b4f" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="875,868 875,890 620,890" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="620,890 620,910" fill="none" stroke="#1d6b4f" stroke-width="1.9" marker-end="url(#ah)"/>
<rect x="340" y="912" width="560" height="66" rx="7" fill="#e6f4ec" stroke="#1d6b4f" stroke-width="1.6"/>
<text x="620.0" y="942.5" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Fusion</text>
<text x="620.0" y="958.8" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">drop the COCO box when IoU &gt; 0.55  —  the thesis model wins</text>
<polyline points="620,978 620,1004" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="300" y="1004" width="640" height="76" rx="7" fill="#fdf6e9" stroke="#b45309" stroke-width="1.6"/>
<text x="620.0" y="1031.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Spatial analysis  (deterministic)</text>
<text x="620.0" y="1048.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">zone from box centre:  LEFT &lt; 0.33 · CENTER · RIGHT &gt; 0.66      (Eq. 3.1–3.2)</text>
<text x="620.0" y="1063.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">proximity from area ratio:  NEAR ≥ 0.15 · MEDIUM ≥ 0.04 · FAR   (Eq. 3.3)</text>
<text x="958" y="1035" text-anchor="start" font-size="11" fill="#b45309" font-weight="700">no depth sensor:</text>
<text x="958" y="1050" text-anchor="start" font-size="10.5" fill="#64748b" font-weight="400">ordinal bands only,</text>
<text x="958" y="1064" text-anchor="start" font-size="10.5" fill="#64748b" font-weight="400">never metres</text>
<polyline points="620,1080 620,1106" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="340" y="1106" width="560" height="72" rx="7" fill="#fdf6e9" stroke="#b45309" stroke-width="1.6"/>
<text x="620.0" y="1131.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Priority ranking   (Eq. 3.4)</text>
<text x="620.0" y="1148.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">danger +100 · indoor +40    center +50    near +30 / medium +12</text>
<text x="620.0" y="1163.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">plus confidence × 10        →  keep the highest-scoring 3</text>
<polyline points="620,1178 620,1200" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<polygon points="620,1200 866,1282 620,1364 374,1282" fill="#fef0c7" stroke="#b45309" stroke-width="2"/>
<text x="620" y="1256" text-anchor="middle" font-size="12.5" fill="#0f172a" font-weight="700">Announcement filter</text>
<text x="620" y="1273" text-anchor="middle" font-size="11" fill="#5c4708" font-weight="400">proximity ≠ FAR ?</text>
<text x="620" y="1290" text-anchor="middle" font-size="11" fill="#5c4708" font-weight="400">cooldown ≥ 3.0 s for this (class, zone) ?</text>
<text x="620" y="1307" text-anchor="middle" font-size="11" fill="#5c4708" font-weight="400">gap ≥ 1.2 s since the last utterance ?</text>
<rect x="902" y="1244" width="246" height="76" rx="7" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6"/>
<text x="1025.0" y="1271.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Stay silent</text>
<text x="1025.0" y="1288.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">keep drawing boxes,</text>
<text x="1025.0" y="1303.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">advance to next frame</text>
<polyline points="866,1282 902,1282" fill="none" stroke="#94a3b8" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="884" y="1274" text-anchor="middle" font-size="11" fill="#64748b" font-weight="700">no</text>
<polyline points="620,1364 620,1394" fill="none" stroke="#b45309" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<text x="636" y="1384" text-anchor="start" font-size="11" fill="#b45309" font-weight="700">yes</text>
<rect x="268" y="1394" width="704" height="76" rx="7" fill="#fdf6e9" stroke="#b45309" stroke-width="1.6"/>
<text x="620.0" y="1421.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Sentence generation  —  one sentence, at most 3 objects</text>
<text x="620.0" y="1438.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">Bengali:  subject–object–verb, animacy classifier একজন / একটি, single closing আছে</text>
<text x="620.0" y="1453.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">English:  plural-aware templates,  urgent prefix when NEAR and CENTER</text>
<polyline points="620,1470 620,1494" fill="none" stroke="#475569" stroke-width="1.9" stroke-linejoin="round" marker-end="url(#ah)"/>
<rect x="248" y="1494" width="360" height="68" rx="7" fill="#f0ebfd" stroke="#5b21b6" stroke-width="1.6"/>
<text x="428.0" y="1517.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Bengali speech</text>
<text x="428.0" y="1534.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">bn-BD-NabanitaNeural</text>
<text x="428.0" y="1549.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">neural TTS, needs network</text>
<rect x="632" y="1494" width="360" height="68" rx="7" fill="#f0ebfd" stroke="#5b21b6" stroke-width="1.6"/>
<text x="812.0" y="1517.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">English speech</text>
<text x="812.0" y="1534.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">system speech engine</text>
<text x="812.0" y="1549.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">offline, no network</text>
<polyline points="620,1478 428,1478 428,1492" fill="none" stroke="#b45309" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="620,1478 812,1478 812,1492" fill="none" stroke="#b45309" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="428,1478 428,1496" fill="none" stroke="#5b21b6" stroke-width="1.9" marker-end="url(#ah)"/>
<polyline points="812,1478 812,1496" fill="none" stroke="#5b21b6" stroke-width="1.9" marker-end="url(#ah)"/>
<polyline points="428,1562 428,1584 620,1584 620,1596" fill="none" stroke="#5b21b6" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="812,1562 812,1584 620,1584" fill="none" stroke="#5b21b6" stroke-width="1.9" stroke-linejoin="round"/>
<polyline points="620,1584 620,1600" fill="none" stroke="#5b21b6" stroke-width="1.9" marker-end="url(#ah)"/>
<rect x="196" y="1602" width="400" height="80" rx="7" fill="#f0ebfd" stroke="#5b21b6" stroke-width="1.6"/>
<text x="396.0" y="1631.9" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Annotated video feed</text>
<text x="396.0" y="1648.2" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">boxes, class labels, zone dividers,</text>
<text x="396.0" y="1663.4" text-anchor="middle" font-size="11.5" fill="#475569" font-weight="400">live frame rate and object count</text>
<rect x="644" y="1602" width="400" height="80" rx="7" fill="#f0ebfd" stroke="#5b21b6" stroke-width="1.6"/>
<text x="844.0" y="1631.3" text-anchor="middle" font-size="15" fill="#0f172a" font-weight="700">Spoken guidance</text>
<text x="844.0" y="1648.1" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">সাবধান! সামনে খুব কাছে একটি গর্ত আছে।</text>
<text x="844.0" y="1663.9" text-anchor="middle" font-size="12" fill="#475569" font-weight="400">“Careful! A pothole is close ahead.”</text>
<text x="1064" y="1636" text-anchor="start" font-size="12.5" fill="#1d6b4f" font-weight="700">22.9 FPS</text>
<text x="1064" y="1652" text-anchor="start" font-size="10.5" fill="#64748b" font-weight="400">end to end</text>
